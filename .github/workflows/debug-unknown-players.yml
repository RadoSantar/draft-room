name: Debug Unknown Players

# Temporärer, manuell auslösbarer Workflow: prüft, warum manche Transaktions-Spieler als
# "Unbekannter Spieler #<id>" erscheinen (kein data/*.json-Write, kein Commit). Wird nach Gebrauch
# wieder entfernt.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unbekannte Spieler untersuchen
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/debug-unknown-players.mjs
