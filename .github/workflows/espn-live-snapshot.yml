name: ESPN Live-Score-Snapshot

# Holt alle 30 Minuten während jedes NFL-Spieltags (Do/So/Mo) den aktuellen Zwischenstand der
# laufenden Fantasy-Woche und hängt ihn an data/live-snapshots.json an - beginnend jeweils VOR dem
# ersten Kickoff des Tages bis nach dem letzten Spielende. Dient AUSSCHLIESSLICH dazu, dass der
# wöchentliche ESPN-Sync (siehe espn-sync.yml) am Ende der Woche echte Verlaufs-Storylines bauen
# kann (Kollaps/Comeback, Führungswechsel, nie eingeholter Vorsprung, bis zum letzten Spiel offene
# Rennen) - sonst wäre nach Wochenende nur noch der Endstand sichtbar, kein Verlauf. Je dichter die
# Zwischenstände, desto genauer diese Geschichten.
#
# Jeder Tag braucht zwei cron-Zeilen, weil das Fenster über Mitternacht UTC hinausläuft (ein
# einzelner cron-Eintrag kann keinen Wochentags-Wechsel innerhalb einer Zeile abbilden):
# - Do 23:00 UTC bis Fr 05:30 UTC: vor dem Thursday-Night-Kickoff bis nach Spielende.
# - So 16:00 UTC bis Mo 05:30 UTC: vor den frühen Sonntagsspielen, durchgehend über die späten
#   Nachmittagsspiele und das Sunday Night Football hinweg, bis nach dessen Ende.
# - Mo 23:00 UTC bis Di 05:30 UTC: vor dem Monday-Night-Kickoff bis nach Spielende.
# Die Fenster sind grosszügig bemessen (nicht minutengenau) - bei Zeitzonenumstellung (Sommer-/
# Winterzeit in den USA) verschieben sich die echten Anstosszeiten ohnehin leicht gegenüber UTC,
# der Puffer an beiden Enden fängt das ab. Läuft NIE Claude/Anthropic-Calls oder committet
# team-content.json.
on:
  schedule:
    - cron: '*/30 23 * * 4'   # Donnerstag 23:00/23:30 UTC – vor dem TNF-Kickoff
    - cron: '*/30 0-5 * * 5'  # Freitag 00:00–05:30 UTC – während/nach dem TNF
    - cron: '*/30 16-23 * * 0' # Sonntag 16:00–23:30 UTC – vor den frühen Spielen bis ins SNF hinein
    - cron: '*/30 0-5 * * 1'  # Montag 00:00–05:30 UTC – während/nach dem SNF
    - cron: '*/30 23 * * 1'   # Montag 23:00/23:30 UTC – vor dem MNF-Kickoff
    - cron: '*/30 0-5 * * 2'  # Dienstag 00:00–05:30 UTC – während/nach dem MNF
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Live-Zwischenstand snapshotten
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/snapshot-live-scores.mjs

      - name: Snapshot committen
        run: |
          git config user.name "espn-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          for delay in 0 2 4 8 16; do
            if [ "$delay" != "0" ]; then
              echo "Erneuter Versuch in ${delay}s…"
              git fetch origin main
              git reset --soft origin/main
              sleep "$delay"
            fi
            git add data/live-snapshots.json
            if git diff --cached --quiet; then
              echo "Keine Änderungen, nichts zu committen."
              exit 0
            fi
            git commit -m "Live-Score-Snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Push nach mehreren Versuchen fehlgeschlagen."
          exit 1
