name: ESPN Live-Score-Snapshot

# Holt mehrmals pro Spieltag (Do/So/Mo, während die NFL-Spiele laufen) den aktuellen
# Zwischenstand der laufenden Fantasy-Woche und hängt ihn an data/live-snapshots.json an.
# Dient AUSSCHLIESSLICH dazu, dass der wöchentliche ESPN-Sync (siehe espn-sync.yml) am Ende
# der Woche echte Verlaufs-Storylines bauen kann (Kollaps/Comeback, Führungswechsel) – sonst
# wäre nach Wochenende nur noch der Endstand sichtbar, kein Verlauf.
#
# Die Zeiten sind grosszügige, ungefähre Fenster rund um die üblichen NFL-Anstosszeiten
# (Thursday/Sunday/Monday Night Football + Sonntag-Nachmittagsspiele), bewusst nicht
# minutengenau – bei Zeitzonenumstellung (Sommer-/Winterzeit in den USA) verschieben sich die
# echten Anstosszeiten ohnehin leicht gegenüber UTC, exakte Präzision ist für die Storyline-
# Zwecke hier nicht nötig. Läuft NIE Claude/Anthropic-Calls oder committet team-content.json.
on:
  schedule:
    - cron: '30 23 * * 4'  # Donnerstag 23:30 UTC – mitten im Thursday Night Football
    - cron: '0 3 * * 5'    # Freitag 03:00 UTC – kurz nach Ende des TNF
    - cron: '0 18 * * 0'   # Sonntag 18:00 UTC – mitten in den frühen Sonntagsspielen
    - cron: '0 21 * * 0'   # Sonntag 21:00 UTC – mitten in den späten Nachmittagsspielen
    - cron: '30 23 * * 0'  # Sonntag 23:30 UTC – während des Sunday Night Football
    - cron: '0 3 * * 1'    # Montag 03:00 UTC – kurz nach Ende des SNF
    - cron: '30 23 * * 1'  # Montag 23:30 UTC – mitten im Monday Night Football
    - cron: '0 3 * * 2'    # Dienstag 03:00 UTC – kurz nach Ende des MNF, vor dem Haupt-Sync um 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Live-Zwischenstand snapshotten
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/snapshot-live-scores.mjs

      - name: Snapshot committen
        run: |
          git config user.name "espn-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          for delay in 0 2 4 8 16; do
            if [ "$delay" != "0" ]; then
              echo "Erneuter Versuch in ${delay}s…"
              git fetch origin main
              git reset --soft origin/main
              sleep "$delay"
            fi
            git add data/live-snapshots.json
            if git diff --cached --quiet; then
              echo "Keine Änderungen, nichts zu committen."
              exit 0
            fi
            git commit -m "Live-Score-Snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Push nach mehreren Versuchen fehlgeschlagen."
          exit 1
