name: Debug Transactions

# Temporärer, manuell auslösbarer Workflow: dumpt ESPNs rohes mTransactions2-Response-Shape in die
# Action-Logs (kein data/*.json-Write, kein Commit) - dient nur dazu, die Umstellung von
# Roster-Diffing auf ESPNs echtes Transaktions-Log korrekt zu implementieren. Wird danach wieder
# entfernt.

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ESPN-Transaktionen dumpen
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/debug-transactions.mjs
