name: ESPN Sync

# Holt Standings/Scoreboard/Transaktionen/Power-Rankings-Zahlen aus der privaten
# ESPN-Liga, lässt Claude Spiel-Recaps für die zuletzt abgeschlossene Woche
# schreiben, und committet die aktualisierten data/*.json-Dateien.
# Rührt NIE data/team-content.json (handgeschriebene Analysen/Ausblicke) an.
#
# Der Commit-Schritt fetch+resettet+recommittet bei einem Push-Konflikt (siehe
# unten) statt zu rebasen: ist zwischen Checkout und Push ein anderer Commit auf
# main gelandet (z.B. der Changelog-Bot, oder ein manueller Push), würde ein
# simples "git push" sonst mit "fetch first" fehlschlagen – live so beobachtet,
# als während eines Sync-Laufs parallel committet wurde. Da data/*.json bei
# jedem Lauf komplett neu von ESPN generiert wird (keine manuellen Edits),
# ist "auf dem neuesten main neu committen" einfacher und robuster als ein
# Rebase, der bei geänderter Basis in Konflikte laufen könnte.
on:
  schedule:
    # Jeden Dienstag ab 05:07 UTC (= 07:07 Schweizer Sommerzeit), danach alle 2h bis 13:07 UTC.
    # Ist die letzte Woche (z.B. wegen eines späten Monday-Night-Spiels) bei einem Lauf noch nicht
    # komplett gewertet, überspringt sync-espn.mjs Recap/History für diese Woche einfach (siehe dort)
    # und der nächste Lauf 2h später prüft automatisch erneut – ganz ohne eigene Retry-Logik, weil
    # jeder Lauf ohnehin den kompletten aktuellen Stand neu von ESPN lädt.
    # Minute bewusst auf :07 statt :00 - laut GitHub selbst ist die volle Stunde die Zeit mit der
    # höchsten Last für Scheduled-Workflows, wo Läufe eher übersprungen statt nur verzögert werden
    # (live beobachtet am 22.9.2026: weder der 05:00- noch der 07:00-UTC-Trigger feuerte). Zusätzliches
    # Netz falls TROTZDEM mal alle 5 Läufe an einem Dienstag ausfallen: espn-sync-watchdog.yml.
    - cron: '7 5,7,9,11,13 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ESPN-Daten synchronisieren
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/sync-espn.mjs

      - name: Änderungen committen
        run: |
          git config user.name "espn-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          for delay in 0 2 4 8 16; do
            if [ "$delay" != "0" ]; then
              echo "Erneuter Versuch in ${delay}s…"
              git fetch origin main
              git reset --soft origin/main
              sleep "$delay"
            fi
            git add data/
            if git diff --cached --quiet; then
              echo "Keine Änderungen, nichts zu committen."
              exit 0
            fi
            git commit -m "Automatischer ESPN-Sync: Standings, Scoreboard, Transaktionen, Power Rankings"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Push nach mehreren Versuchen fehlgeschlagen."
          exit 1
