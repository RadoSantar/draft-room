name: ESPN Sync Watchdog

# Zwei unabhängige Netze gegen fehlgeschlagene/ausgefallene espn-sync-Läufe - reagieren auf
# unterschiedliche Fehlerbilder, deshalb zwei Jobs statt einem:
#
# 1. fast-retry (workflow_run-Trigger): reagiert INNERHALB von Sekunden, sobald ein espn-sync.yml-
#    Lauf fertig ist. Ist der Lauf fehlgeschlagen (z.B. wegen des Sanity-Checks am Ende von
#    sync-espn.mjs, der stillschweigend kaputte/leere Daten abfängt), wird sofort ein Retry
#    angestossen - statt bis zum nächsten reguären 2h-Slot oder gar bis zum Tages-Check unten zu
#    warten. Reagiert bewusst NUR auf scheduled Läufe (github.event.workflow_run.event == 'schedule'),
#    nicht auf workflow_dispatch - sonst würde ein fehlschlagender Retry sich selbst erneut triggern
#    (Endlosschleife). Ein einzelner zusätzlicher Retry-Versuch pro fehlgeschlagenem Lauf reicht als
#    Netz; schlägt der auch fehl, greift der nächste reguläre 2h-Slot oder der Tages-Check.
#
# 2. daily-check (eigener Zeitplan): fängt das andere Fehlerbild ab, bei dem GAR KEIN Lauf feuert
#    (GitHub kann Scheduled-Runs bei hoher Last komplett überspringen statt nur zu verzögern - live
#    beobachtet am 22.9.2026, weder der 05:00- noch der 07:00-UTC-Trigger feuerte). Dafür gibt es
#    kein workflow_run-Event zum Reagieren, deshalb die eigene, zeitbasierte Prüfung: läuft 1x pro
#    Dienstag um 14:23 UTC (nach dem letzten regulären Versuch um 13:07 UTC, bewusst auf einer
#    Minute abseits von :00), prüft ob heute überhaupt schon ein erfolgreicher Lauf war, und stösst
#    sonst einen nach.
on:
  schedule:
    - cron: '23 14 * * 2'
  workflow_run:
    workflows: ["ESPN Sync"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  fast-retry:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fehlgeschlagenen Sync-Lauf sofort erneut anstossen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Geplanter ESPN-Sync-Lauf ${{ github.event.workflow_run.id }} war '${{ github.event.workflow_run.conclusion }}' - stosse sofort einen Retry an."
          gh workflow run espn-sync.yml --ref main

  daily-check:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Prüfen ob heute schon ein erfolgreicher ESPN-Sync-Lauf war
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LATEST=$(gh api "repos/${{ github.repository }}/actions/workflows/espn-sync.yml/runs?status=success&branch=main&per_page=1" --jq '.workflow_runs[0].created_at // empty')
          echo "Letzter erfolgreicher Lauf: ${LATEST:-keiner gefunden}"
          if [[ "$LATEST" == "$TODAY"* ]]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fallback-Lauf anstossen
        if: steps.check.outputs.already_ran == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Kein erfolgreicher Sync heute gefunden - stosse Fallback-Lauf an."
          gh workflow run espn-sync.yml --ref main
